            // Вычисляем навыки и атрибуты
            const currentAttributes = { brawn: 2, nerves: 2, smooth: 2, focus: 2, crime: 2 };
            const currentSkills = {};
            Object.keys(SKILLS_BY_ATTR).forEach(attr => SKILLS_BY_ATTR[attr].forEach(s => currentSkills[s] = 1));

            if (role) {
                currentAttributes[role.attr] += 1;
                role.skills.forEach(s => currentSkills[s] += 1);
            }

            if (trope && tropeAttr) {
                currentAttributes[tropeAttr] += 1;
                trope.skills.forEach(s => currentSkills[s] += 1);
            }

            Object.entries(freeSkills).forEach(([skill, val]) => {
                currentSkills[skill] += val;
            });

            const freeSkillsSpent = Object.values(freeSkills).reduce((a, b) => a + b, 0);

            const handleSkillChange = (skill, delta) => {
                const current = currentSkills[skill];
                const base = current - (freeSkills[skill] || 0);
                const newValue = (freeSkills[skill] || 0) + delta;

                if (delta > 0) {
                    if (freeSkillsSpent >= 2) return;
                    if (base + newValue > 3) return; 
                }
                if (newValue < 0) return;

                setFreeSkills(prev => ({ ...prev, [skill]: newValue }));
            };

            const toggleRoleFeat = (featId) => {
                if (roleFeats.includes(featId)) {
                    setRoleFeats(roleFeats.filter(id => id !== featId));
                } else {
                    const maxFeats = age === 'Young' ? 1 : 2;
                    if (roleFeats.length < maxFeats) setRoleFeats([...roleFeats, featId]);
                }
            };

            const resetTropeAttr = (newTrope) => {
                setTropeAttr(null);
                setTropeFeat(null);
                if (role && newTrope.attrs.includes(role.attr)) {
                    const availableAttr = newTrope.attrs.find(a => a !== role.attr);
                    setTropeAttr(availableAttr);
                }
            };

            const oldFeatOptions = [];
            if (role && trope) {
                const availableRoleFeats = role.feats.filter(f => !roleFeats.includes(f));
                const availableTropeFeats = trope.feats.filter(f => f !== tropeFeat);
                oldFeatOptions.push(...availableRoleFeats, ...availableTropeFeats);
            }

            const canProceed = () => {
                if (step === 1) return role !== null && roleFeats.length === (age === 'Young' ? 1 : 2);
                if (step === 2) return trope !== null && tropeAttr !== null && tropeFeat !== null;
                if (step === 3) return freeSkillsSpent === 2 && (age !== 'Old' || oldFeat !== null);
                return true;
            };

            const nextStep = () => { if (canProceed() && step < 4) setStep(step + 1); };
            const prevStep = () => { if (step > 0) setStep(step - 1); };

            const renderSkillDots = (val) => (
                <div className="flex gap-1">
                    {[1, 2, 3].map(i => (
                        <div key={i} className={`w-3 h-3 rounded-full border border-gray-400 dark:border-gray-600 ${i <= val ? 'bg-red-600 border-red-600' : ''}`} />
                    ))}
                </div>
            );

            const renderFeatCard = (featId, isSelected, onClick) => {
                const feat = FEATS_DATA[featId];
                if (!feat) return null;
                return (
                    <div key={featId} onClick={onClick} className={`p-4 border rounded-xl cursor-pointer transition-all ${isSelected ? 'border-red-600 bg-red-50 dark:bg-red-900/20 shadow-md' : 'border-gray-200 dark:border-gray-700 hover:border-red-300 dark:hover:border-red-700'}`}>
                        <div className="flex justify-between items-center mb-2">
                            <h4 className="font-bold text-gray-900 dark:text-white">{feat.name}</h4>
                            {isSelected && <Check className="w-5 h-5 text-red-600" />}
                        </div>
                        <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">{feat.desc}</p>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans pb-24 print:pb-0 print:bg-white print:text-black">
                    {/* Header */}
                    <div className="sticky top-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 print:hidden">
                        <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                            <h1 className="text-xl font-black tracking-wider uppercase">OUTGUNNED <span className="text-red-600">Constructor</span></h1>
                            <div className="flex gap-4 items-center">
                                <span className="text-sm font-bold text-gray-500">ШАГ {step}/4</span>
                                <button onClick={() => window.print()} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full" title="Печать">
                                    <Printer className="w-5 h-5" />
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                                    {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 py-8">
                        {step === 0 && (
                            <div className="text-center space-y-8 animate-fadeIn">
                                <div className="max-w-2xl mx-auto p-12 bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700">
                                    <h2 className="text-4xl font-black mb-6 uppercase tracking-tight">Создай своего <span className="text-red-600">Героя боевика</span></h2>
                                    <p className="text-lg text-gray-600 dark:text-gray-300 mb-8 leading-relaxed">Добро пожаловать в конструктор персонажей для НРИ Outgunned. Следуй шагам, выбирай архетипы, вдохновленные классикой кино, и готовься к адреналиновому экшену.</p>
                                    <button onClick={() => setStep(1)} className="px-8 py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-lg transition-transform transform hover:scale-105 shadow-lg shadow-red-600/30">Начать создание</button>
                                </div>
                            </div>
                        )}

                        {step === 1 && (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-2xl font-black uppercase border-l-4 border-red-600 pl-4 mb-2">Выберите Роль</h2>
                                <p className="text-gray-600 dark:text-gray-400 mb-6">Роль определяет ваш основной профиль, базовое снаряжение и даёт 1 очко Атрибута и 10 очков Навыков.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {ROLES_DATA.map(r => (
                                        <div key={r.id} onClick={() => { setRole(r); setRoleFeats([]); resetTropeAttr(trope || {attrs:[]}); }} className={`p-5 rounded-2xl border-2 cursor-pointer transition-all ${role?.id === r.id ? 'border-red-600 bg-red-50 dark:bg-red-900/10 shadow-lg' : 'border-gray-200 dark:border-gray-700 hover:border-red-400 dark:bg-gray-800'}`}>
                                            <h3 className="text-xl font-bold mb-1">{r.name}</h3>
                                            <p className="text-xs font-semibold text-red-600 mb-3 uppercase tracking-wider">Примеры: {r.ref}</p>
                                            <p className="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{r.desc}</p>
                                        </div>
                                    ))}
                                </div>
                                {role && (
                                    <div className="mt-8 p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                        <h3 className="text-lg font-bold mb-4">Выберите Черты ({age === 'Young' ? 1 : 2} шт.)</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {role.feats.map(featId => renderFeatCard(featId, roleFeats.includes(featId), () => toggleRoleFeat(featId)))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-2xl font-black uppercase border-l-4 border-red-600 pl-4 mb-2">Выберите Амплуа (Trope)</h2>
                                <p className="text-gray-600 dark:text-gray-400 mb-6">Амплуа добавляет вашему герою характер. Оно даёт 1 очко Атрибута и 8 очков Навыков.</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                    {TROPES_DATA.map(t => (
                                        <div key={t.id} onClick={() => { setTrope(t); resetTropeAttr(t); }} className={`p-5 rounded-2xl border-2 cursor-pointer transition-all ${trope?.id === t.id ? 'border-red-600 bg-red-50 dark:bg-red-900/10 shadow-lg' : 'border-gray-200 dark:border-gray-700 hover:border-red-400 dark:bg-gray-800'}`}>
                                            <h3 className="text-xl font-bold mb-2">{t.name}</h3>
                                            <p className="text-xs text-gray-500 mb-1">Доступные атрибуты: {t.attrs.map(a => TRANSLATIONS[a]).join(' или ')}</p>
                                        </div>
                                    ))}
                                </div>

                                {trope && (
                                    <div className="mt-8 p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-8">
                                        <div>
                                            <h3 className="text-lg font-bold mb-4">Бонусный Атрибут Амплуа</h3>
                                            {role && trope.attrs.includes(role.attr) ? (
                                                <p className="text-sm p-4 bg-gray-100 dark:bg-gray-700 rounded-xl">Поскольку ваша Роль уже дала бонус к <strong>{TRANSLATIONS[role.attr]}</strong>, ваше Амплуа автоматически повышает <strong>{TRANSLATIONS[tropeAttr]}</strong>.</p>
                                            ) : (
                                                <div className="flex gap-4">
                                                    {trope.attrs.map(attr => (
                                                        <button key={attr} onClick={() => setTropeAttr(attr)} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${tropeAttr === attr ? 'border-red-600 bg-red-600 text-white' : 'border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:border-red-400'}`}>
                                                            {TRANSLATIONS[attr]}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <h3 className="text-lg font-bold mb-4">Выберите Черту Амплуа (1 шт.)</h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                {trope.feats.map(featId => renderFeatCard(featId, tropeFeat === featId, () => setTropeFeat(featId)))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-6 animate-fadeIn">
                                <h2 className="text-2xl font-black uppercase border-l-4 border-red-600 pl-4 mb-2">Настройка и Возраст</h2>
                                
                                <div className="p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                                    <h3 className="text-lg font-bold mb-4">Возраст Героя</h3>
                                    <div className="flex flex-wrap gap-4">
                                        {['Young', 'Adult', 'Old'].map(a => (
                                            <button key={a} onClick={() => {
                                                setAge(a);
                                                if(a === 'Young' && roleFeats.length > 1) setRoleFeats([roleFeats[0]]);
                                                if(a !== 'Old') setOldFeat(null);
                                            }} className={`px-6 py-3 rounded-xl font-bold border-2 transition-all ${age === a ? 'border-red-600 bg-red-600 text-white' : 'border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-300 hover:border-red-400'}`}>
                                                {a === 'Young' ? 'Молодой (Young)' : a === 'Adult' ? 'Взрослый (Adult)' : 'Старый (Old)'}
                                            </button>
                                        ))}
                                    </div>
                                    <p className="mt-4 text-sm text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-gray-900 p-4 rounded-xl border border-gray-200 dark:border-gray-700">
                                        {age === 'Young' && "Молодые герои берут только 1 Черту от Роли вместо 2, но получают уникальную черту «Слишком молод, чтобы умереть» и начинают с 2 очками Адреналина."}
                                        {age === 'Adult' && "Взрослые герои находятся на пике формы. Нет ни штрафов, ни бонусов."}
                                        {age === 'Old' && "Ветераны получают 1 дополнительную Черту из списков своей Роли или Амплуа, но начинают игру с 2 Летальными Пулями в Рулетке Смерти."}
                                    </p>
                                </div>

                                {age === 'Old' && (
                                    <div className="p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                                        <h3 className="text-lg font-bold mb-4 text-red-600">Опыт Ветерана: Выберите экстра-черту</h3>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            {oldFeatOptions.map(featId => renderFeatCard(featId, oldFeat === featId, () => setOldFeat(featId)))}
                                        </div>
                                    </div>
                                )}

                                <div className="p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-lg font-bold">Свободные очки Навыков</h3>
                                        <span className={`px-4 py-2 rounded-full font-bold text-sm ${freeSkillsSpent === 2 ? 'bg-green-100 text-green-700 dark:bg-green-900/30' : 'bg-red-100 text-red-700 dark:bg-red-900/30'}`}>
                                            Потрачено: {freeSkillsSpent} / 2
                                        </span>
                                    </div>
                                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-6">Распределите 2 свободных очка навыков. Максимум 3 очка на один навык.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {Object.keys(SKILLS_BY_ATTR).map(attr => (
                                            <div key={attr} className="space-y-3">
                                                <h4 className="font-black text-gray-400 uppercase tracking-widest text-xs">{TRANSLATIONS[attr]}</h4>
                                                {SKILLS_BY_ATTR[attr].map(skill => (
                                                    <div key={skill} className="flex items-center justify-between bg-gray-50 dark:bg-gray-700/50 p-2 rounded-lg">
                                                        <span className="text-sm font-semibold">{TRANSLATIONS[skill]}</span>
                                                        <div className="flex items-center gap-3">
                                                            <button onClick={() => handleSkillChange(skill, -1)} disabled={!freeSkills[skill]} className="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 disabled:opacity-30 font-bold hover:bg-gray-300 transition-colors">-</button>
                                                            {renderSkillDots(currentSkills[skill])}
                                                            <button onClick={() => handleSkillChange(skill, 1)} disabled={freeSkillsSpent >= 2 || currentSkills[skill] >= 3} className="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 disabled:opacity-30 font-bold hover:bg-gray-300 transition-colors">+</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-8 animate-fadeIn print:m-0">
                                <div className="text-center print:hidden">
                                    <h2 className="text-3xl font-black uppercase text-red-600 tracking-wider">Досье Героя</h2>
                                </div>

                                <div className="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border-4 border-gray-100 dark:border-gray-700 print:border-none print:shadow-none print:p-0">
                                    {/* Header Sheet */}
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 border-b-2 border-red-600 pb-8">
                                        <div className="space-y-4 col-span-2">
                                            <div className="flex gap-4">
                                                <div className="w-full">
                                                    <label className="text-xs font-black text-red-600 uppercase tracking-widest">Роль</label>
                                                    <div className="text-2xl font-bold uppercase">{role?.name}</div>
                                                </div>
                                                <div className="w-full">
                                                    <label className="text-xs font-black text-red-600 uppercase tracking-widest">Амплуа</label>
                                                    <div className="text-2xl font-bold uppercase">{trope?.name}</div>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-black text-red-600 uppercase tracking-widest">Имя / Позывной</label>
                                                <input type="text" className="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-600 text-xl font-bold py-1 outline-none focus:border-red-600" placeholder="Введите имя..." />
                                            </div>
                                            <div>
                                                <label className="text-xs font-black text-red-600 uppercase tracking-widest">Коронная фраза</label>
                                                <input type="text" className="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-600 text-lg italic py-1 outline-none focus:border-red-600" placeholder="«Я слишком стар для этого...»" />
                                            </div>
                                        </div>
                                        
                                        <div className="bg-gray-50 dark:bg-gray-900 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 flex flex-col justify-center">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="font-black text-gray-500 uppercase">Адреналин</span>
                                                <span className="text-2xl font-black text-red-600">{age === 'Young' ? 2 : 1}</span>
                                            </div>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="font-black text-gray-500 uppercase">Внимание (Spotlight)</span>
                                                <span className="text-2xl font-black text-yellow-500">1</span>
                                            </div>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="font-black text-gray-500 uppercase">Наличные</span>
                                                <span className="text-2xl font-black text-green-600">1</span>
                                            </div>
                                            <div className="flex justify-between items-center border-t border-gray-300 dark:border-gray-700 pt-4 mt-2">
                                                <span className="font-black text-gray-500 uppercase text-xs">Летальные пули</span>
                                                <div className="flex gap-1">
                                                    {[...Array(age === 'Old' ? 2 : 1)].map((_, i) => (
                                                        <div key={i} className="w-4 h-6 bg-gray-800 dark:bg-gray-400 rounded-t-full rounded-b-sm" />
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Stats Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 mb-8">
                                        {Object.keys(SKILLS_BY_ATTR).map(attr => (
                                            <div key={attr} className="bg-gray-50 dark:bg-gray-900 p-4 rounded-2xl border border-gray-200 dark:border-gray-700">
                                                <div className="flex justify-between items-center mb-4 border-b pb-2 dark:border-gray-700">
                                                    <span className="font-black text-red-600 uppercase tracking-wider">{TRANSLATIONS[attr]}</span>
                                                    <div className="flex gap-1">{[1,2,3].map(i => <div key={i} className={`w-3 h-3 transform rotate-45 border ${i <= currentAttributes[attr] ? 'bg-red-600 border-red-600' : 'border-gray-400'}`} />)}</div>
                                                </div>
                                                <div className="space-y-3">
                                                    {SKILLS_BY_ATTR[attr].map(skill => (
                                                        <div key={skill} className="flex justify-between items-center">
                                                            <span className="text-sm font-semibold">{TRANSLATIONS[skill]}</span>
                                                            {renderSkillDots(currentSkills[skill])}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Feats & Abilities */}
                                    <div>
                                        <h3 className="text-xl font-black uppercase border-l-4 border-red-600 pl-4 mb-4">Черты и таланты</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {[...roleFeats, tropeFeat, oldFeat].filter(Boolean).map(featId => (
                                                <div key={featId} className="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700">
                                                    <h4 className="font-bold mb-1">{FEATS_DATA[featId].name}</h4>
                                                    <p className="text-sm text-gray-600 dark:text-gray-400">{FEATS_DATA[featId].desc}</p>
                                                </div>
                                            ))}
                                            {age === 'Young' && (
                                                <div className="p-4 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700">
                                                    <h4 className="font-bold mb-1">Слишком молод, чтобы умереть</h4>
                                                    <p className="text-sm text-gray-600 dark:text-gray-400">При заполнении ячейки 'Плохо' (Bad), вы не получаете Состояние (Condition).</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Bottom Navigation */}
                    {step > 0 && (
                        <div className="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 p-4 print:hidden z-50">
                            <div className="max-w-4xl mx-auto flex justify-between gap-4">
                                <button onClick={prevStep} className="flex-1 py-3 px-6 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-900 dark:text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors min-h-[48px]">
                                    <ChevronLeft className="w-5 h-5" /> Назад
                                </button>
                                {step < 4 && (
                                    <button onClick={nextStep} disabled={!canProceed()} className="flex-1 py-3 px-6 bg-red-600 hover:bg-red-700 disabled:bg-gray-300 dark:disabled:bg-gray-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors min-h-[48px]">
                                        Далее <ChevronRight className="w-5 h-5" />
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
